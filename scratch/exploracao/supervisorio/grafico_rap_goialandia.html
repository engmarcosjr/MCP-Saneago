    // Processamento
    const labels = [];
    const values = [];
    let sum = 0, count = 0, min = 9999, max = -9999;

    rawData.forEach(d => {
      labels.push(d.dt_ref.slice(5, 16)); // MM-DD HH:mm
      const val = d.vl_leitura !== null ? parseFloat(d.vl_leitura) : null;
      values.push(val);
      if (val !== null && !isNaN(val)) {
        sum += val;
        count++;
        if (val < min) min = val;
        if (val > max) max = val;
      }
    });

    const atual = values.filter(v => v !== null).slice(-1)[0] ?? 0;
    const media = (sum / count).toFixed(1);

    document.getElementById("kpiAtual").innerText = atual.toFixed(1) + " %";
    document.getElementById("kpiMax").innerText = max.toFixed(1) + " %";
    document.getElementById("kpiMin").innerText = min.toFixed(1) + " %";
    document.getElementById("kpiMed").innerText = media + " %";

    const ctx = document.getElementById("graficoRap").getContext("2d");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "Nível Reservatório Apoiado (%)",
          data: values,
          borderColor: "#38bdf8",
          backgroundColor: "rgba(56, 189, 248, 0.15)",
          borderWidth: 2,
          fill: true,
          tension: 0.2,
          pointRadius: 0,
          pointHitRadius: 8
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            labels: { color: "#cbd5e1" }
          },
          tooltip: {
            callbacks: {
              label: (ctx) => " Nível: " + ctx.parsed.y + " %"
            }
          }
        },
        scales: {
          x: {
            grid: { color: "#334155" },
            ticks: {
              color: "#94a3b8",
              maxTicksLimit: 12
            }
          },
          y: {
            grid: { color: "#334155" },
            ticks: { color: "#94a3b8" },
            suggestedMin: 0,
            suggestedMax: 100
          }
        }
      }
    });
